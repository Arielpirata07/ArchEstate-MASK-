{% extends "base.html" %}

{% block title %}{{ t('auth.forgot_title') }} | ArchEstate{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="max-w-md w-full">
        <div class="bg-white dark:bg-midnight-light p-10 rounded-lg shadow-2xl border-t-4 border-gold transition-colors">

            <div class="text-center mb-8 header-entrance">
                <i data-lucide="key-round" class="w-10 h-10 text-gold mx-auto mb-4" aria-hidden="true"></i>
                <h1 class="text-3xl font-serif">{{ t('auth.forgot_title') }}</h1>
                <p class="text-midnight/50 dark:text-white/40 mt-2 text-sm">{{ t('auth.forgot_subtitle') }}</p>
            </div>

            <form action="{{ url_for('auth.forgot_password') }}"
                  method="POST"
                  novalidate
                  autocomplete="on">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field space-y-2">
                    <label for="email" class="block text-[10px] uppercase tracking-widest font-bold text-gold">
                        {{ t('auth.email') }}
                    </label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-0 bottom-3 text-midnight/30 dark:text-white/50 w-5 h-5" aria-hidden="true"></i>
                        <input id="email"
                               name="email"
                               type="email"
                               required
                               autocomplete="email"
                               placeholder="{{ t('auth.email_placeholder') }}"
                               class="w-full bg-transparent border-0 border-b border-midnight/10 dark:border-white/10 focus:border-gold focus:ring-0 py-3 pl-8 pr-8 transition-colors outline-none">
                    </div>
                </div>

                <button type="submit"
                        class="btn-submit w-full bg-gold text-white py-4 rounded font-bold uppercase tracking-widest text-xs hover:bg-midnight dark:hover:bg-gold transition-colors mt-8 flex items-center justify-center gap-2 group">
                    <span data-label class="flex items-center gap-2">
                        {{ t('auth.forgot_send_btn') }}
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform" aria-hidden="true"></i>
                    </span>
                    <i data-spinner data-lucide="loader-2" class="spinner hidden" aria-hidden="true"></i>
                    <span data-spinner-label class="hidden">{{ t('auth.login_sending') }}</span>
                </button>
            </form>

            <div class="mt-8 text-center border-t border-midnight/5 dark:border-white/5 pt-6">
                <p class="text-xs text-midnight/60 dark:text-white/60">
                    {{ t('auth.back_to_login') }}
                    <a href="{{ url_for('auth.login') }}" class="text-gold font-bold hover:text-midnight dark:hover:text-gold transition-colors ml-1">
                        {{ t('auth.login_btn') }}
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
