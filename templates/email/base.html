<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ArchEstate{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FAF9F7; font-family: 'Helvetica Neue', Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #FAF9F7; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #000410; padding: 24px 32px; text-align: center;">
                            <h1 style="margin: 0; color: #735A3A; font-size: 24px; font-style: italic;">ArchEstate</h1>
                            <p style="margin: 4px 0 0; color: #A68A64; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;">The Private Ledger</p>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #F4F3F1; padding: 20px 32px; text-align: center;">
                            <p style="margin: 0; font-size: 12px; color: #666666;">
                                {{ t('email.auto_footer') }}
                            </p>
                            <p style="margin: 8px 0 0; font-size: 11px; color: #999999;">
                                © 2026 ArchEstate — The Private Ledger
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
