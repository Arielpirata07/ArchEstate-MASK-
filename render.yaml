services:
  - type: web
    name: archestate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 4 --worker-class sync --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_CONTENT_SID
        sync: false
      - key: TWILIO_WHATSAPP_BUTTON_CONTENT_SID
        sync: false
      - key: TWILIO_WHATSAPP_LEAD_CONTENT_SID
        sync: false
      - key: TWILIO_SIMULATE
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PREFER_SECURE_COOKIES
        value: "true"
      - key: SENTRY_DSN
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false

  - type: web
    name: archestate-staging
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --worker-class sync --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: SITE_URL
        value: "https://archestate-staging.onrender.com"
      - key: TWILIO_SIMULATE
        value: "true"
      - key: PREFER_SECURE_COOKIES
        value: "false"
      - key: STAGING
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
